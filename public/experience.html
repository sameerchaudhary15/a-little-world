<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little something for you ♡</title>
<meta name="description" content="Someone made a little corner of the internet just for you.">
<meta property="og:title" content="A little something, just for you ♡">
<meta property="og:description" content="Someone made a little corner of the internet just for you.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF5EC">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/world.css">
</head>
<body class="world">

<div id="experience">
  <div class="bloom-layer" id="bloomLayer" aria-hidden="true"></div>
  <div class="petal-layer" id="petalLayer" aria-hidden="true"></div>
  <div class="burst-layer" id="burstLayer" aria-hidden="true"></div>

  <!-- Loading / not found -->
  <section class="state-screen" id="loading"><span class="hand">unfolding…</span></section>
  <section class="state-screen" id="missing" hidden>
    <p class="sec-num">hmm.</p>
    <h1>This little world<br><em>doesn't exist.</em></h1>
    <p>The link might be incomplete, or it was taken down. Ask whoever sent it to check.</p>
  </section>

  <!-- Opening -->
  <section class="intro" id="intro" hidden>
    <p class="intro-kicker">Someone made a little corner of the internet just for you.</p>
    <div class="env-wrap">
      <span class="hand env-aside">(it's not a bill, promise)</span>
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="env-letter" id="envLetter">
          <span class="hand">for</span>
          <span class="env-name" data-name></span>
        </div>
        <div class="env-front"></div>
        <div class="env-flap" id="envFlap"></div>
        <div class="env-seal" id="envSeal">♡</div>
      </div>
    </div>
    <h1 class="intro-hello">Well, hello, <em data-name></em> <span class="heart">♡</span></h1>
    <button class="btn-open" id="openBtn">Open your little surprise</button>
  </section>

  <!-- Sections are rendered here in the order chosen in the dashboard -->
  <main class="journey" id="journey" hidden></main>
</div>

<!-- shared overlay for letters, flower notes, results -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-backdrop" data-close></div>
  <div class="overlay-card" id="overlayCard" role="dialog" aria-modal="true">
    <button class="overlay-close" data-close aria-label="Close">×</button>
    <div id="overlayBody"></div>
  </div>
</div>

<p class="watermark" id="watermark" aria-hidden="true">The site is developed by Sameer ♡</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/js/flowers.js"></script>
<script src="/js/defaults.js"></script>
<script src="/js/world-core.js"></script>
<script src="/js/world-sections.js"></script>
<script src="/js/world-play.js"></script>
<script src="/js/world-boot.js"></script>
</body>
</html>
